name: 📱 Build iOS App (Without Mac)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍏 Compile Native iOS Package (.ipa)
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/with-node@v4
        with:
          node-version: 20

      - name: 📦 Install NPM Dependencies & Capacitor
        run: |
          npm install --no-audit
          npx cap sync ios

      - name: 🛠️ Setup CocoaPods & Pod Install
        run: |
          cd ios/App
          pod install || true

      - name: 🏗️ Build iOS App with Xcode
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
                       -scheme App \
                       -sdk iphoneos \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       AD_HOC_CODE_SIGNING_ALLOWED=YES \
                       COMPILER_INDEX_STORE_ENABLE=NO
          else
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -sdk iphoneos \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       AD_HOC_CODE_SIGNING_ALLOWED=YES \
                       COMPILER_INDEX_STORE_ENABLE=NO
          fi

      - name: 📦 Create Unsigned IPA Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found!"
            exit 1
          fi
          echo "Found app at $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r CliniqueSaaS-iOS.ipa Payload

      - name: 📤 Upload iOS App Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: CliniqueSaaS-iOS-Unsigned
          path: CliniqueSaaS-iOS.ipa
          retention-days: 14
